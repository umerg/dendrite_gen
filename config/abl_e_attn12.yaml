# ABLATION ARM E -- "attention reallocation" (round 2)
#
# Fork of neuron_type_conditional_run.yaml (= arm A, the round-1 winner). ONLY the
# attention block changes; everything else is byte-identical to A.
#
# Round-1 result that motivates this: arms B/C/D all thinned the message pathway
# (edge_mlp_hidden, node_mlp_hidden AND m_dim) and all three lost to A. C and D were
# the only arms to improve axial extent -- and they were also the only ones to unsqueeze
# the global pathway. So the attention upgrade plausibly helped and got swamped by the
# message-pathway damage in the same arm. E tests it cleanly: message pathway stays at
# A's legacy widths (1042 / 512 / m_dim 256), and the attention upgrade is paid for
# entirely from inside the attention block by trimming its FFN 4.0x -> 2.5x feats_dim.
#
# E/F/G form a ladder: hold attention inner=256 and tokens=32, then progressively cheapen
# the attention FFN and convert the savings into depth. All three sit within 0.4% of A's
# parameter count, so "did it just get more capacity?" is off the table.
#
# 21,644,284 params (+0.01% vs A). 12 layers, 6 attention blocks, ff = 2.50x feats_dim.

defaults:
  - _self_
  - dataset: neurons_conditional_full  # cleaned, class-labelled neurons (soma-rooted, binarized, NO root-degree cap; MAX_CHILDREN=23). Override with dataset=neurons_conditional for the old cap=16 set.
  - diffusion: flow_v10
  - method: expansion

reduction:
  type: "depth"
  mode: "deterministic"
  cherry_p: 1.0
  ensure_progress: True
  root: 0
  contract_root: False

training:
  batch_size: 256 # can adjust based on GPU memory
  lr: 1e-4
  optimizer: adam      # adam | adamw (adamw = decoupled weight decay)
  weight_decay: 0.0     # AdamW decoupled weight decay; 0.01 = torch default. Tune (0 == plain Adam).
  num_steps: 20000
  max_num_workers: 0
  log_interval: 20 # can make 5K as well
  save_checkpoint: True
  resume: False # False, True (latest checkpoint), step number, or path to .pt file
  lr_scheduler: "cosine_annealing"
  scheduler_T_max: ${training.num_steps}
  scheduler_eta_min: 1e-6
  grad_clip_norm: 1.0   # max global grad-norm; null disables clipping. Pre-clip norm is always logged as training/grad_norm

validation:
  batch_size: 64 # adjust according to GPU memory
  interval: 200 
  first_step: 0
  per_graph_size: False
  eval_mode: rollout               # rollout | teacher_forced | both. both = free-running metrics AND
                                # per-level TF eval each validation (expensive). Use teacher_forced
                                # to run ONLY the TF eval (skips free-running generation + its metrics/plots).
  tf_max_graphs: 64             # cap GT trees for TF eval (full ODE per reduction level per graph)
  tf_min_depth: 0               # restrict pooled TF metrics to leaves at tree depth >= this (2 drops root children)
  enable_plots: True            # 3D multi-azimuth views (orbiting uhat) of gen + GT
  enable_dist_metrics: True     # Wasserstein-1 of gen-vs-GT stat distributions
  ged_enabled: False             # avg tree-edit distance (capped by node/pair count)
  ged_timeout: 5.0
  plot_angles: [[20, 30], [20, 120], [20, 210]]   # (elev, azim) around uhat
  enable_ks: False               # KS alongside W1 (continuous features)
  enable_morphometrics: True    # path/radial/contraction/order/strahler/asymmetry/sholl
  enable_light_joint: True      # morpho + Euclidean-TMD MMD/Density/Coverage every val
  enable_floor: False            # real-vs-real reference lines + headline excess
  tmd_eval_filtration: radial_root
  tmd_eval_bins: 16
  tmd_pca_ncomp: 64             # N~2000: 256-d is fine; PCA mostly de-noises
  dc_nearest_k: 5               # k for Density/Coverage
  # Reporting tier for the distribution metrics: headline | standard | full.
  # PURELY a wandb filter -- every metric is still computed and still written to
  # validation/step_*.pkl, so switching tiers is free and changes no number.
  metric_report_level: standard
  # ZCA-whiten the standardized morpho vector before the MMD/Density/Coverage kernel.
  # Off by default; the pruned MORPHO_KEYS already removes most correlation distortion.
  morpho_whiten: False
  # Per-cell-class stratified distribution metrics (curated subset; tree-edit/KS skipped).
  per_cell_class: True
  per_cell_class_min_count: 20   # skip classes with fewer val graphs (degenerate PCA/kNN)

testing: False

model:
  name: egnn
  num_layers: 12
  feats_dim: 256
  m_dim: 256
  tmd_hidden_dim: 0            # >0 enables TMD conditioning; tmd_in_dim is auto-derived (n_filtrations * tmd_bins**2)
  tmd_filtrations: [path, height, radial_root]   # radial_root = Euclidean-from-soma (axis-agnostic); path/height key off so2_axis (y for neurons)
  tmd_bins: 16                 # persistence-image grid per filtration
  # Cell-type (class) conditioning: one-hot(num_classes) -> Linear(class_hidden_dim), always-on.
  num_classes: 7              # 7 kept pyramidal types (utils.data_loading.CELL_CLASS_NAMES)
  class_hidden_dim: 16        # >0 enables type conditioning; reserved slice of feats_dim
  dropout: 0.1
  norm_feats: True
  # ---- ARM E: the ONLY change from A is inside the attention block. ----
  global_linear_attn_every: 2        # 6 global mixing points over 12 layers (same as A)
  global_linear_attn_heads: 8        # inner = 8*32 = 256 -> matched to the stream (A: 64, a 4x squeeze)
  global_linear_attn_dim_head: 32
  num_global_tokens: 32              # 4x the global summary capacity; ~6K params
  offset_head_hidden: 256
  # Per-layer MLP hidden widths. Leave UNSET for the defaults:
  #   edge_mlp / node_mlp -> feats_dim (contracted, as in the original Satorras EGNN, where
  #                          phi_e projects the concatenated node pair DOWN to feats_dim)
  #   attention FFNs      -> 4*feats_dim (standard transformer ratio)
  # edge_mlp is by far the largest parameter block (~12.2*feats_dim^2 of ~27*feats_dim^2 per
  # layer at the legacy 2*edge_input_dim width), so it is the main size dial.
  # WARNING: setting any of these changes state_dict shapes -> a checkpoint only loads with
  # the same values it was trained with (load_state_dict is strict).
  # Legacy widths for this config (pre-configurable behaviour, feats_dim=256, rbf_k=0):
  edge_mlp_hidden: 1042   # = 2*edge_input_dim = 2*(2*256 + 4 + 5)
  node_mlp_hidden: 512    # = 2*feats_dim
  # Keep edge_mlp_hidden >= m_dim; below that the second Linear becomes an expansion, which
  # is not what "contracted" is meant to mean.
  # Pays for the wider attention: FFN 1024 (4.0x) -> 640 (2.5x feats_dim), still a
  # conventional transformer ratio. Net effect on params is +0.01% vs A.
  global_linear_attn_ff_hidden: 640
  use_global_fallback_frames: False
  so2_axis: [0., 1., 0.] # z-axis for trees, y-axis for neurons
  # Root-child ordinal-0 criterion. first_edge = legacy (child_0 = most-negative first-edge
  # uhat component). axial_extent = pin ordinal 0 (and fwd0) to the root child whose SUBTREE
  # reaches deepest along -uhat (the apical); ~97% apical fidelity vs ~62% for first_edge.
  # Gates BOTH training (dataset apical flag) and sampling (skip root-child ordinal correction);
  # a checkpoint must be sampled in the mode it was trained in.
  root_child_order: axial_extent  # first_edge | axial_extent
  # RBF edge-distance kernel (default OFF). Set rbf_k>0 to expand rho/du into Gaussian
  # channels instead of raw scalars. Ranges are in pos_scale_factor-normalized units.
  rbf_k: 0              # >0 = rbf_k Gaussian channels per distance (recommended 16); 0 = raw scalar
  rbf_gamma: 10.0       # Gaussian width (shared by rho & du)
  rbf_rho_max: 4.0      # in-plane radius span [0, rho_max]; neuron C_0 rho p99=3.1 (scale 1/45.1, axis y)
  rbf_du_max: 4.0       # axial span [-du_max, du_max]; neuron |du| p99=3.1

ema: # 0.999 EMA now that the update formula is fixed; warmup ramps and saturates at beta by ~step 1000 (gamma/power below)
  betas: [0.999] # EMA beta values to sweep; 1 = no EMA, 0.99 = fast EMA, 0.999 = slow EMA
  gamma: 1.0
  power: 1.0

name: abl_e_attn12_20k
debugging: False
debugging_max_batches: 50
debugging_dir: "neurons_debug"

wandb:
  logging: True
